author: Banditoz & Mucker
changes:
  - balance: Spider implants no longer spawn nursing spiders.
  - balance: Spider implants only can spawn around 5 to 7 spiders before they 
      stop working.
  - balance: Spider implants no longer spawn spiders if the implantee is dead.
  - balance: Spider implants now only allow up to 2 spiders to be alive at once 
      near the implantee.
  - balance: Tweaked the spider implant to only spawn a spider once every 180 
      seconds (up from 60 seconds), variance of 60 seconds.
delete-after: true
